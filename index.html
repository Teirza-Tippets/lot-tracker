<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lot Tracker</title>
<style>
  :root {
    --bg: #eef1f3; --card: #ffffff; --ink: #1d2733; --muted: #5d6b7a;
    --line: #d5dce2; --accent: #0f766e; --accent-ink: #ffffff; --done: #94a3b0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14191f; --card: #1c232b; --ink: #e6ebf0; --muted: #9aa8b6;
            --line: #2d3742; --accent: #2dd4bf; --accent-ink: #0b1a18; --done: #5d6b7a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 20px; color: var(--muted); }
  .route { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .route span { padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px;
                background: var(--card); font-size: .9rem; }
  .lot { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
         padding: 14px 16px; margin-bottom: 12px; display: grid; gap: 10px;
         grid-template-columns: 1fr auto; align-items: center; }
  .lot h2 { font-size: 1.05rem; margin: 0; }
  .meta { color: var(--muted); font-size: .9rem; }
  .steps { display: flex; gap: 4px; margin-top: 8px; }
  .steps i { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
  .steps i.done { background: var(--done); }
  .steps i.now { background: var(--accent); }
  button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 0; cursor: pointer;
           background: var(--accent); color: var(--accent-ink); }
  button:disabled { background: var(--line); color: var(--muted); cursor: not-allowed; }
  button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
  .op { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  input { font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
          background: var(--card); color: var(--ink); width: 11rem; }
  #msg { min-height: 1.5em; margin: 0 0 16px; color: var(--muted); }
  #msg.error { color: #b45309; font-weight: 600; }
  .lot.hold { border-color: #b45309; border-left-width: 6px; }
  .hold-note { color: #b45309; font-size: .9rem; }
  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
  table { border-collapse: collapse; width: 100%; margin-top: 6px; font-size: .85rem; }
  th, td { text-align: left; padding: 4px 8px 4px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
  @media (max-width: 520px) { .lot { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Lot Tracker</h1>
  <p class="sub">Track lots in and out of each process step, like a manufacturing execution system (MES).</p>
  <div class="op">
    <label for="op">Operator ID</label>
    <input id="op" autocomplete="off" placeholder="e.g. TT204">
  </div>
  <p id="msg" role="status"></p>
  <div class="route" id="route" aria-label="Process route"></div>
  <div id="lots"></div>
</main>

<script>
  // STEP 2: the process route. Every lot must pass through these in order.
  const ROUTE = ["Clean", "Coat", "Expose", "Etch", "Inspect"];

  // STEP 3: lots. status is "Queued", "Running", or "Complete".
  const lots = [
    { id: "LOT-1001", product: "A14 Wafer", qty: 25, step: 0, status: "Queued", lastEvent: null, history: [] },
    { id: "LOT-1002", product: "A14 Wafer", qty: 25, step: 2, status: "Queued", lastEvent: null, history: [] },
    { id: "LOT-1003", product: "B07 Wafer", qty: 12, step: 4, status: "Running", lastEvent: null, history: [] },
  ];

  const now = () => new Date().toLocaleTimeString();

  // STEP 6: audit history. Every action is recorded (who, what, when) and never edited.
  function log(lot, who, action, detail) {
    const entry = { time: new Date().toLocaleString(), who, action, detail };
    lot.history.push(entry);
    lot.lastEvent = `${who}: ${action}, ${detail}`;
  }
  const esc = t => String(t).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  lots.forEach(l => log(l, "SYSTEM", "Created", ROUTE[l.step]));

  // STEP 5: rules. The system refuses actions that break the process.
  const SPEC = { step: "Inspect", min: 95, max: 105 }; // acceptable reading range

  function say(text, isError) {
    const m = document.getElementById("msg");
    m.textContent = text;
    m.className = isError ? "error" : "";
  }

  // Rule 1: every action needs an operator ID.
  function operator() {
    const id = document.getElementById("op").value.trim().toUpperCase();
    if (!id) say("Enter your operator ID before doing anything.", true);
    return id;
  }

  function trackIn(lot) {
    const op = operator();
    if (!op || lot.status !== "Queued") return;
    lot.status = "Running";
    log(lot, op, "Track in", ROUTE[lot.step]);
    say(`${lot.id} is running at ${ROUTE[lot.step]}.`);
  }

  function trackOut(lot) {
    const op = operator();
    if (!op || lot.status !== "Running") return;
    const stepName = ROUTE[lot.step];
    let reading = null;

    // Rule 2: the inspection step needs a measurement, and bad readings stop the lot.
    if (stepName === SPEC.step) {
      reading = parseFloat(prompt(`Inspection reading for ${lot.id} (spec ${SPEC.min} to ${SPEC.max}):`));
      if (Number.isNaN(reading)) return say("A valid reading is required to track out of Inspect.", true);
      if (reading < SPEC.min || reading > SPEC.max) {
        lot.status = "On Hold";
        lot.holdBy = op;
        lot.holdReason = `Reading ${reading} is outside spec ${SPEC.min} to ${SPEC.max}`;
        log(lot, op, "Placed on hold", lot.holdReason);
        return say(`${lot.id} placed on hold: ${lot.holdReason}.`, true);
      }
    }

    log(lot, op, "Track out", reading === null ? stepName : `${stepName}, reading ${reading}`);
    lot.step += 1;
    lot.status = lot.step >= ROUTE.length ? "Complete" : "Queued";
    say(`${lot.id} moved on.`);
  }

  // Rule 3: releasing a hold needs a reason and a different person than the one who set it.
  function release(lot) {
    const op = operator();
    if (!op || lot.status !== "On Hold") return;
    if (op === lot.holdBy) return say("A different operator must release this hold.", true);
    const reason = (prompt("Reason for releasing the hold:") || "").trim();
    if (!reason) return say("A release reason is required.", true);
    lot.status = "Queued"; // goes back to be re-inspected
    log(lot, op, "Released hold", reason);
    lot.holdBy = lot.holdReason = null;
    say(`${lot.id} released and queued for ${ROUTE[lot.step]}.`);
  }

  function render() {
    document.getElementById("route").innerHTML =
      ROUTE.map(s => `<span>${s}</span>`).join("");

    const box = document.getElementById("lots");
    const open = new Set([...document.querySelectorAll("details[open]")].map(d => d.dataset.id)); // keep panels open
    box.innerHTML = "";
    lots.forEach(lot => {
      const bars = ROUTE.map((_, i) =>
        `<i class="${i < lot.step ? "done" : i === lot.step && lot.status !== "Complete" ? "now" : ""}"></i>`
      ).join("");
      const where = lot.status === "Complete" ? "Finished all steps" : `Step: ${ROUTE[lot.step]}`;
      const el = document.createElement("div");
      el.className = "lot" + (lot.status === "On Hold" ? " hold" : "");
      el.innerHTML = `
        <div>
          <h2>${lot.id}: ${lot.status}</h2>
          <div class="meta">${lot.product}, ${lot.qty} units. ${where}</div>
          <div class="meta">${esc(lot.lastEvent)}</div>
          ${lot.status === "On Hold" ? `<div class="hold-note">${lot.holdReason}</div>` : ""}
          <div class="steps">${bars}</div>
          <details data-id="${lot.id}" ${open.has(lot.id) ? "open" : ""}>
            <summary>History (${lot.history.length})</summary>
            <table>
              <tr><th>When</th><th>Who</th><th>Action</th><th>Detail</th></tr>
              ${[...lot.history].reverse().map(h =>
                `<tr><td>${esc(h.time)}</td><td>${esc(h.who)}</td><td>${esc(h.action)}</td><td>${esc(h.detail)}</td></tr>`).join("")}
            </table>
          </details>
        </div>
        <div>
          <button data-act="in" ${lot.status === "Queued" ? "" : "disabled"}>Track in</button>
          <button data-act="out" ${lot.status === "Running" ? "" : "disabled"}>Track out</button>
          ${lot.status === "On Hold" ? '<button data-act="release">Release hold</button>' : ""}
        </div>`;
      el.querySelector('[data-act="in"]').onclick = () => { trackIn(lot); render(); };
      el.querySelector('[data-act="out"]').onclick = () => { trackOut(lot); render(); };
      const rel = el.querySelector('[data-act="release"]');
      if (rel) rel.onclick = () => { release(lot); render(); };
      box.appendChild(el);
    });
  }

  render();
</script>
</body>
</html>
